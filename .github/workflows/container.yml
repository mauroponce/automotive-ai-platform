name: Quality and containers
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: automotive
          POSTGRES_PASSWORD: automotive_local_only
          POSTGRES_DB: automotive
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U automotive" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://automotive_app:automotive_app_local_only@localhost:5432/automotive
      MIGRATION_DATABASE_URL: postgresql://automotive:automotive_local_only@localhost:5432/automotive
      POSTGRES_APP_PASSWORD: automotive_app_local_only
      POSTGRES_DB: automotive
      APP_DEMO_MODE: "true"
      S3_ENDPOINT: http://localhost:59000
      S3_REGION: us-east-1
      S3_BUCKET: automotive-integration
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadminchange
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      - run: docker build -f Dockerfile.storage -t automotive-test-storage .
      - run: docker run -d --name integration-minio -p 127.0.0.1:59000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadminchange automotive-test-storage
      - run: curl --retry 20 --retry-delay 1 --retry-connrefused --fail http://localhost:59000/minio/health/live
      - run: npm run test:integration
      - run: npm run build
      - run: npm run build:worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  containers:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/automotive-ai-platform:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/automotive-ai-platform:worker
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/automotive-ai-platform:migrator
