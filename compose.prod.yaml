services:
  web:
    image: ${IMAGE_TAG:-ghcr.io/your-org/automotive-ai-platform:latest}
    build: { context: ., target: production }
    env_file: .env.production
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
  worker:
    image: ${IMAGE_TAG:-ghcr.io/your-org/automotive-ai-platform:latest}
    command: npm run worker
    env_file: .env.production
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
  postgres:
    image: postgres:16-alpine
    env_file: .env.production
    restart: unless-stopped
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 10s, timeout: 5s, retries: 12 }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [web]
volumes: { postgres_data: {}, caddy_data: {}, caddy_config: {} }
